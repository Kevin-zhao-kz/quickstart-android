workflows:
  android-workflow:
    name: Build APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Debug APK
        script: |
          cd admob
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - admob/app/build/outputs/apk/debug/*.apk
      - admob/build/outputs/apk/debug/*.apk
      - "**/*.apk"
