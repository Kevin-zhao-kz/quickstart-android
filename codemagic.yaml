workflows:
  android-workflow:
    name: build swiss app
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Swiss App
        script: |
          rm -f admob/build.gradle.kts admob/build.gradle
          mkdir -p admob/src/main/java/com/google/firebase/quickstart/admob
          cat > admob/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.google.firebase.quickstart.admob'
              compileSdk 34
              defaultConfig {
                  applicationId "com.google.firebase.quickstart.admob"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > admob/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Swiss Tournament">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > admob/src/main/java/com/google/firebase/quickstart/admob/MainActivity.java <<'JAVA_EOF'
          package com.google.firebase.quickstart.admob;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.*;
          import android.graphics.Color;
          import java.util.*;
          public class MainActivity extends Activity {
              static class Player { String name; double score=0; ArrayList<Integer> opponents=new ArrayList<>(); boolean hasBye=false; int wins=0; }
              static class Match { int p1, p2; int result=0; String label=""; }
              ArrayList<Player> players=new ArrayList<>();
              ArrayList<ArrayList<Match>> allRounds=new ArrayList<>();
              int totalRounds=5, currentRound=0;
              boolean inKnockout=false;
              Match semi1, semi2, finalMatch, thirdMatch;
              LinearLayout root, playerListLayout, roundLayout, standingLayout, knockoutLayout;
              EditText inputName, inputRounds;
              TextView statusText;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(30,30,30,30);
                  ScrollView scroll=new ScrollView(this); scroll.addView(root); setContentView(scroll);
                  TextView title=new TextView(this); title.setText("Swiss + 淘汰赛"); title.setTextSize(24); title.setGravity(Gravity.CENTER); root.addView(title);
                  LinearLayout addRow=new LinearLayout(this); addRow.setOrientation(LinearLayout.HORIZONTAL);
                  inputName=new EditText(this); inputName.setHint("玩家名字"); inputName.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
                  Button btnAdd=new Button(this); btnAdd.setText("添加"); addRow.addView(inputName); addRow.addView(btnAdd); root.addView(addRow);
                  playerListLayout=new LinearLayout(this); playerListLayout.setOrientation(LinearLayout.VERTICAL); root.addView(playerListLayout);
                  LinearLayout roundSetRow=new LinearLayout(this); roundSetRow.setOrientation(LinearLayout.HORIZONTAL); roundSetRow.setPadding(0,20,0,0);
                  inputRounds=new EditText(this); inputRounds.setHint("瑞士轮数 默认5"); inputRounds.setInputType(android.text.InputType.TYPE_CLASS_NUMBER); inputRounds.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
                  Button btnStart=new Button(this); btnStart.setText("开始瑞士轮"); roundSetRow.addView(inputRounds); roundSetRow.addView(btnStart); root.addView(roundSetRow);
                  // 单独开淘汰赛按钮
                  Button btnKnockoutOnly=new Button(this); btnKnockoutOnly.setText("【单独开淘汰赛】直接用当前名单打4强"); btnKnockoutOnly.setBackgroundColor(Color.parseColor("#FFC107")); root.addView(btnKnockoutOnly);
                  statusText=new TextView(this); statusText.setPadding(0,20,0,10); root.addView(statusText);
                  roundLayout=new LinearLayout(this); roundLayout.setOrientation(LinearLayout.VERTICAL); root.addView(roundLayout);
                  standingLayout=new LinearLayout(this); standingLayout.setOrientation(LinearLayout.VERTICAL); root.addView(standingLayout);
                  knockoutLayout=new LinearLayout(this); knockoutLayout.setOrientation(LinearLayout.VERTICAL); root.addView(knockoutLayout);
                  btnAdd.setOnClickListener(v->{ String name=inputName.getText().toString().trim(); if(name.isEmpty()) return; Player p=new Player(); p.name=name; players.add(p); inputName.setText(""); refreshPlayerList(); });
                  btnStart.setOnClickListener(v-> startTournament());
                  btnKnockoutOnly.setOnClickListener(v-> startKnockoutDirect());
                  refreshPlayerList();
              }
              void refreshPlayerList(){ playerListLayout.removeAllViews(); TextView tv=new TextView(this); StringBuilder sb=new StringBuilder(); for(int i=0;i<players.size();i++){ if(i>0) sb.append(", "); sb.append(players.get(i).name); } tv.setText("已添加 "+players.size()+" 人: "+sb); playerListLayout.addView(tv); }
              void startTournament(){ if(players.size()<2){ Toast.makeText(this,"至少2人",Toast.LENGTH_SHORT).show(); return; } try{ if(!inputRounds.getText().toString().isEmpty()) totalRounds=Integer.parseInt(inputRounds.getText().toString()); }catch(Exception e){} if(totalRounds<1) totalRounds=1; allRounds.clear(); currentRound=0; inKnockout=false; knockoutLayout.removeAllViews(); for(Player p:players){ p.score=0; p.opponents.clear(); p.hasBye=false; p.wins=0; } nextRound(); }
              void startKnockoutDirect(){ if(players.size()<4){ Toast.makeText(this,"淘汰赛至少4人，请先添加",Toast.LENGTH_SHORT).show(); return; } // 按当前名单直接取前4
                  if(players.size()>=4){ startKnockoutPhase(); } }
              void nextRound(){ if(currentRound>=totalRounds){ statusText.setText("瑞士轮结束！共 "+totalRounds+" 轮"); showStandings(); showKnockoutEntry(); return; } currentRound++; ArrayList<Match> matches=generatePairing(); allRounds.add(matches); showRound(matches); showStandings(); }
              ArrayList<Match> generatePairing(){ ArrayList<Integer> idx=new ArrayList<>(); for(int i=0;i<players.size();i++) idx.add(i); Collections.sort(idx,(a,b)-> Double.compare(players.get(b).score, players.get(a).score)); ArrayList<Match> matches=new ArrayList<>(); boolean[] used=new boolean[players.size()]; if(idx.size()%2==1){ for(int k=idx.size()-1;k>=0;k--){ int id=idx.get(k); if(!players.get(id).hasBye &&!used[id]){ Match m=new Match(); m.p1=id; m.p2=-1; m.result=4; matches.add(m); players.get(id).score+=1; players.get(id).hasBye=true; players.get(id).wins++; used[id]=true; break; } } } for(int i=0;i<idx.size();i++){ int a=idx.get(i); if(used[a]) continue; used[a]=true; int opponent=-1; for(int j=i+1;j<idx.size();j++){ int b=idx.get(j); if(used[b]) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(used[b]||b==a) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(!used[b] && b!=a){ opponent=b; break; } } } if(opponent!=-1){ used[opponent]=true; Match m=new Match(); m.p1=a; m.p2=opponent; matches.add(m); } } return matches; }
              void showRound(ArrayList<Match> matches){ if(inKnockout) return; roundLayout.removeAllViews(); TextView tv=new TextView(this); tv.setText("第 "+currentRound+" / "+totalRounds+" 轮"); tv.setTextSize(20); roundLayout.addView(tv); for(int i=0;i<matches.size();i++){ Match m=matches.get(i); LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL); row.setPadding(0,10,0,10); row.setBackgroundColor(i%2==0? Color.parseColor("#F0F0F0"): Color.WHITE); TextView matchText=new TextView(this); matchText.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); matchText.setTextSize(16); if(m.p2==-1){ matchText.setText(players.get(m.p1).name+" 轮空 +1分"); row.addView(matchText); } else { matchText.setText(players.get(m.p1).name+" vs "+players.get(m.p2).name); row.addView(matchText); if(m.result==0){ Button b1=new Button(this); b1.setText(players.get(m.p1).name+"胜"); Button b2=new Button(this); b2.setText(players.get(m.p2).name+"胜"); Button bD=new Button(this); bD.setText("平"); b1.setOnClickListener(v->{ setResult(m,1); showRound(matches); showStandings(); }); b2.setOnClickListener(v->{ setResult(m,2); showRound(matches); showStandings(); }); bD.setOnClickListener(v->{ setResult(m,3); showRound(matches); showStandings(); }); row.addView(b1); row.addView(bD); row.addView(b2); } else { TextView res=new TextView(this); String r=m.result==1? players.get(m.p1).name+"胜": m.result==2? players.get(m.p2).name+"胜":"平局"; res.setText(" "+r); res.setTextColor(Color.BLUE); row.addView(res); } } roundLayout.addView(row); } boolean allDone=true; for(Match m:matches) if(m.p2!=-1 && m.result==0) allDone=false; if(allDone){ Button btnNext=new Button(this); btnNext.setText(currentRound==totalRounds?"完成瑞士轮":"开始下一轮"); btnNext.setOnClickListener(v-> nextRound()); roundLayout.addView(btnNext); statusText.setText("第"+currentRound+"轮已结束"); } else statusText.setText("第"+currentRound+"轮进行中"); }
              void setResult(Match m,int result){ if(m.result!=0) return; m.result=result; if(result==1){ players.get(m.p1).score+=1; players.get(m.p1).wins++; } else if(result==2){ players.get(m.p2).score+=1; players.get(m.p2).wins++; } else if(result==3){ players.get(m.p1).score+=0.5; players.get(m.p2).score+=0.5; } players.get(m.p1).opponents.add(m.p2); if(m.p2!=-1) players.get(m.p2).opponents.add(m.p1); }
              void showStandings(){ standingLayout.removeAllViews(); TextView t=new TextView(this); t.setText("\n积分榜:"); t.setTextSize(18); standingLayout.addView(t); ArrayList<Integer> idx=getSortedIdx(); for(int rank=0;rank<idx.size();rank++){ int id=idx.get(rank); Player p=players.get(id); TextView row=new TextView(this); String mark=rank<4?" ★前4":""; row.setText((rank+1)+". "+p.name+" - "+p.score+"分 ("+p.wins+"胜)"+mark); row.setPadding(0,5,0,5); if(rank<4) row.setTextColor(Color.parseColor("#D32F2F")); standingLayout.addView(row); } }
              ArrayList<Integer> getSortedIdx(){ ArrayList<Integer> idx=new ArrayList<>(); for(int i=0;i<players.size();i++) idx.add(i); Collections.sort(idx,(a,b)->{ int cmp=Double.compare(players.get(b).score, players.get(a).score); if(cmp!=0) return cmp; return Integer.compare(players.get(b).wins, players.get(a).wins); }); return idx; }
              void showKnockoutEntry(){ if(players.size()<4) return; knockoutLayout.removeAllViews(); TextView tv=new TextView(this); tv.setText("\n瑞士轮结束，前4名已锁定！"); tv.setTextSize(18); tv.setTextColor(Color.RED); knockoutLayout.addView(tv); Button btn=new Button(this); btn.setText("进入淘汰赛 (1 vs 4, 2 vs 3)"); btn.setBackgroundColor(Color.parseColor("#4CAF50")); btn.setTextColor(Color.WHITE); btn.setOnClickListener(v-> startKnockoutPhase()); knockoutLayout.addView(btn); }
              void startKnockoutPhase(){ inKnockout=true; roundLayout.removeAllViews(); ArrayList<Integer> idx=getSortedIdx(); if(idx.size()<4){ Toast.makeText(this,"至少4人才能淘汰赛",Toast.LENGTH_SHORT).show(); return; } int p1=idx.get(0), p2=idx.get(1), p3=idx.get(2), p4=idx.get(3); semi1=new Match(); semi1.p1=p1; semi1.p2=p4; semi1.label="半决赛1: 1 vs 4"; semi2=new Match(); semi2.p1=p2; semi2.p2=p3; semi2.label="半决赛2: 2 vs 3"; finalMatch=null; thirdMatch=null; showKnockoutBracket(); }
              void showKnockoutBracket(){ knockoutLayout.removeAllViews(); TextView title=new TextView(this); title.setText("\n=== 淘汰赛 ==="); title.setTextSize(22); title.setGravity(Gravity.CENTER); knockoutLayout.addView(title); addKnockoutMatchView(semi1, true); addKnockoutMatchView(semi2, true); if(semi1.result!=0 && semi2.result!=0){ if(finalMatch==null){ int w1=semi1.result==1?semi1.p1:semi1.p2; int w2=semi2.result==1?semi2.p1:semi2.p2; int l1=semi1.result==1?semi1.p2:semi1.p1; int l2=semi2.result==1?semi2.p2:semi2.p1; finalMatch=new Match(); finalMatch.p1=w1; finalMatch.p2=w2; finalMatch.label="决赛"; thirdMatch=new Match(); thirdMatch.p1=l1; thirdMatch.p2=l2; thirdMatch.label="季军赛"; } TextView t2=new TextView(this); t2.setText("\n-- 决赛阶段 --"); t2.setTextSize(18); knockoutLayout.addView(t2); addKnockoutMatchView(thirdMatch,false); addKnockoutMatchView(finalMatch,false); if(finalMatch.result!=0){ int champ=finalMatch.result==1?finalMatch.p1:finalMatch.p2; TextView champView=new TextView(this); champView.setText("\n🏆 冠军: "+players.get(champ).name+" 🏆"); champView.setTextSize(24); champView.setGravity(Gravity.CENTER); champView.setTextColor(Color.parseColor("#FF9800")); knockoutLayout.addView(champView); } } }
              void addKnockoutMatchView(Match m, boolean isSemi){ if(m==null) return; LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.VERTICAL); row.setPadding(0,15,0,15); TextView label=new TextView(this); label.setText(m.label+" : "+players.get(m.p1).name+" vs "+players.get(m.p2).name); label.setTextSize(16); row.addView(label); LinearLayout btnRow=new LinearLayout(this); btnRow.setOrientation(LinearLayout.HORIZONTAL); if(m.result==0){ Button b1=new Button(this); b1.setText(players.get(m.p1).name+" 胜"); Button b2=new Button(this); b2.setText(players.get(m.p2).name+" 胜"); b1.setOnClickListener(v->{ m.result=1; showKnockoutBracket(); }); b2.setOnClickListener(v->{ m.result=2; showKnockoutBracket(); }); btnRow.addView(b1); btnRow.addView(b2); } else { TextView res=new TextView(this); String r=m.result==1?players.get(m.p1).name+" 晋级":players.get(m.p2).name+" 晋级"; res.setText("结果: "+r); res.setTextColor(Color.BLUE); res.setTextSize(16); btnRow.addView(res); } row.addView(btnRow); knockoutLayout.addView(row); }
          }
          JAVA_EOF
          sed -i '' 's/9.6.1/8.7/' gradle/wrapper/gradle-wrapper.properties || sed -i 's/9.6.1/8.7/' gradle/wrapper/gradle-wrapper.properties
          rm -f build.gradle.kts build.gradle settings.gradle
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "quickstart"
          include(":admob")
          EOF
          chmod +x gradlew &&./gradlew :admob:assembleDebug
    artifacts:
      - "**/*.apk"
