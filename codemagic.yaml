workflows:
  android-workflow:
    name: build 9.1.0
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build V9.1.0
        script: |
          rm -rf ~/.gradle/wrapper/dists/gradle-9.6.1-bin
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          rm -f admob/build.gradle.kts admob/build.gradle
          mkdir -p admob/src/main/java/com/google/firebase/quickstart/admob admob/src/main/res/values
          cat > admob/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.google.firebase.quickstart.admob'
              compileSdk 34
              defaultConfig {
                  applicationId "com.swiss.tournament.cn"
                  minSdk 24
                  targetSdk 34
                  versionCode 910
                  versionName "9.1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF
          cat > admob/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.Swiss" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="android:windowBackground">@android:color/white</item>
                  <item name="android:windowIsTranslucent">false</item>
                  <item name="android:windowDisablePreview">true</item>
              </style>
          </resources>
          EOF
          cat > admob/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="瑞士轮计分器" android:theme="@style/Theme.Swiss" android:hardwareAccelerated="false" android:icon="@android:mipmap/sym_def_app_icon" android:roundIcon="@android:mipmap/sym_def_app_icon">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask" android:hardwareAccelerated="false" android:screenOrientation="portrait"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity>
              </application>
          </manifest>
          EOF
          cat > admob/src/main/java/com/google/firebase/quickstart/admob/MainActivity.java <<'JAVA_EOF'
          package com.google.firebase.quickstart.admob;
          import androidx.appcompat.app.AlertDialog; import androidx.appcompat.app.AppCompatActivity;
          import android.os.Bundle; import android.view.Gravity; import android.widget.*; import android.graphics.Color; import android.content.SharedPreferences; import java.util.*;
          public class MainActivity extends AppCompatActivity {
              static class Player { String name; double score=0; ArrayList<Integer> opponents=new ArrayList<>(); ArrayList<Double> results=new ArrayList<>(); boolean hasBye=false; int wins=0, draws=0, losses=0; double buchholz=0; boolean selected=true; }
              static class Career { String name; int tourCount=0; int bestRank=999; int totalRank=0; double avgRank=0; HashMap<String, int[]> h2h=new HashMap<>(); }
              static class Match { int p1, p2; int result=0; String label=""; }
              ArrayList<Player> players=new ArrayList<>(); int totalRounds=4, currentRound=0; boolean inKnockout=false; Match semi1, semi2, finalMatch; ArrayList<ArrayList<Match>> koRounds=new ArrayList<>(); int koCurrent=0; ArrayList<ArrayList<Match>> allRounds=new ArrayList<>();
              LinearLayout root, playerListLayout, roundLayout, standingLayout, knockoutLayout, settlementLayout, playerContainer; TextView statusText; EditText inputName, inputRounds; SharedPreferences prefs, careerPrefs;
              HashMap<String, Career> careerMap=new HashMap<>(); final int WIN_PTS=3, DRAW_PTS=1, BYE_PTS=3; boolean playerListExpanded=true;

              @Override protected void onCreate(Bundle b){ super.onCreate(b); prefs=getSharedPreferences("swiss_prefs_cn", MODE_PRIVATE); careerPrefs=getSharedPreferences("career_stats_cn", MODE_PRIVATE); loadCareer();
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(30,30,30,30); root.setBackgroundColor(Color.WHITE);
                  ScrollView scroll=new ScrollView(this); scroll.addView(root); setContentView(scroll);
                  TextView title=new TextView(this); title.setText("瑞士轮计分器 V9.1.0"); title.setTextSize(22); title.setGravity(Gravity.CENTER); root.addView(title);

                  LinearLayout playerHeader=new LinearLayout(this); playerHeader.setOrientation(LinearLayout.HORIZONTAL); playerHeader.setPadding(0,20,0,10);
                  TextView playerHeadTitle=new TextView(this); playerHeadTitle.setText("选手名单"); playerHeadTitle.setTextSize(16); playerHeadTitle.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
                  Button btnToggle=new Button(this); btnToggle.setText("折叠"); playerHeader.addView(playerHeadTitle); playerHeader.addView(btnToggle); root.addView(playerHeader);

                  playerContainer=new LinearLayout(this); playerContainer.setOrientation(LinearLayout.VERTICAL); root.addView(playerContainer);
                  LinearLayout addRow=new LinearLayout(this); addRow.setOrientation(LinearLayout.HORIZONTAL); inputName=new EditText(this); inputName.setHint("输入选手姓名"); inputName.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); Button btnAdd=new Button(this); btnAdd.setText("添加"); addRow.addView(inputName); addRow.addView(btnAdd); playerContainer.addView(addRow);
                  LinearLayout manageRow=new LinearLayout(this); manageRow.setOrientation(LinearLayout.HORIZONTAL); Button btnSave=new Button(this); btnSave.setText("保存名单"); Button btnClear=new Button(this); btnClear.setText("清空名单"); Button btnAll=new Button(this); btnAll.setText("全选"); Button btnNone=new Button(this); btnNone.setText("全不选"); manageRow.addView(btnSave); manageRow.addView(btnClear); manageRow.addView(btnAll); manageRow.addView(btnNone); playerContainer.addView(manageRow);
                  playerListLayout=new LinearLayout(this); playerListLayout.setOrientation(LinearLayout.VERTICAL); playerContainer.addView(playerListLayout);

                  btnToggle.setOnClickListener(v->{ playerListExpanded=!playerListExpanded; playerContainer.setVisibility(playerListExpanded? LinearLayout.VISIBLE: LinearLayout.GONE); btnToggle.setText(playerListExpanded? "折叠":"展开"); });

                  LinearLayout roundSetRow=new LinearLayout(this); roundSetRow.setOrientation(LinearLayout.HORIZONTAL); inputRounds=new EditText(this); inputRounds.setHint("轮数 默认4"); inputRounds.setInputType(android.text.InputType.TYPE_CLASS_NUMBER); inputRounds.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); Button btnStart=new Button(this); btnStart.setText("开始瑞士轮(已勾选)"); roundSetRow.addView(inputRounds); roundSetRow.addView(btnStart); root.addView(roundSetRow);
                  Button btnKnockoutFull=new Button(this); btnKnockoutFull.setText("★ 全员单败淘汰赛(已勾选)"); btnKnockoutFull.setBackgroundColor(Color.parseColor("#FFC107")); root.addView(btnKnockoutFull);
                  statusText=new TextView(this); statusText.setPadding(0,20,0,10); root.addView(statusText);
                  roundLayout=new LinearLayout(this); roundLayout.setOrientation(LinearLayout.VERTICAL); root.addView(roundLayout);
                  settlementLayout=new LinearLayout(this); settlementLayout.setOrientation(LinearLayout.VERTICAL); root.addView(settlementLayout);
                  standingLayout=new LinearLayout(this); standingLayout.setOrientation(LinearLayout.VERTICAL); root.addView(standingLayout);
                  knockoutLayout=new LinearLayout(this); knockoutLayout.setOrientation(LinearLayout.VERTICAL); root.addView(knockoutLayout);

                  btnAdd.setOnClickListener(v->{ String name=inputName.getText().toString().trim(); if(name.isEmpty()) return; Player p=new Player(); p.name=name; p.selected=true; players.add(p); inputName.setText(""); savePlayers(); refreshPlayerList(); });
                  btnSave.setOnClickListener(v->{ savePlayers(); Toast.makeText(this,"已保存"+players.size()+"人",0).show(); });
                  btnAll.setOnClickListener(v->{ for(Player p: players) p.selected=true; refreshPlayerList(); });
                  btnNone.setOnClickListener(v->{ for(Player p: players) p.selected=false; refreshPlayerList(); });
                  btnClear.setOnClickListener(v->{ new AlertDialog.Builder(this).setTitle("确认清空").setMessage("确定清空？").setPositiveButton("清空",(d,w)->{ players.clear(); savePlayers(); refreshPlayerList(); standingLayout.removeAllViews(); roundLayout.removeAllViews(); knockoutLayout.removeAllViews(); settlementLayout.removeAllViews(); statusText.setText("已清空"); }).setNegativeButton("取消",null).show(); });
                  btnStart.setOnClickListener(v-> startTournament()); btnKnockoutFull.setOnClickListener(v-> startFullKnockout());
                  loadPlayers(); refreshPlayerList();
              }
              ArrayList<Integer> getSelectedIndices(){ ArrayList<Integer> sel=new ArrayList<>(); for(int i=0;i<players.size();i++) if(players.get(i).selected) sel.add(i); return sel; }
              void loadCareer(){ careerMap.clear(); for(Map.Entry<String,?> e: careerPrefs.getAll().entrySet()){ try{ String s=(String)e.getValue(); String[] parts=s.split("\\|"); Career c=new Career(); c.name=e.getKey(); c.tourCount=Integer.parseInt(parts[0]); c.bestRank=Integer.parseInt(parts[1]); c.totalRank=Integer.parseInt(parts[2]); if(parts.length>4 &&!parts[4].isEmpty()){ for(String h: parts[4].split(";")){ if(h.isEmpty()) continue; String[] kv=h.split(":"); String opp=kv[0]; String[] wld=kv[1].split("-"); c.h2h.put(opp,new int[]{Integer.parseInt(wld[0]),Integer.parseInt(wld[1]),Integer.parseInt(wld[2])}); } } c.avgRank=c.tourCount>0?(double)c.totalRank/c.tourCount:0; careerMap.put(c.name,c);} catch(Exception ex){} } }
              void saveCareer(){ SharedPreferences.Editor ed=careerPrefs.edit(); ed.clear(); for(Career c: careerMap.values()){ StringBuilder h2hSb=new StringBuilder(); for(Map.Entry<String,int[]> en: c.h2h.entrySet()){ if(h2hSb.length()>0) h2hSb.append(";"); h2hSb.append(en.getKey()).append(":").append(en.getValue()[0]).append("-").append(en.getValue()[1]).append("-").append(en.getValue()[2]); } String val=c.tourCount+"|"+c.bestRank+"|"+c.totalRank+"||"+h2hSb.toString(); ed.putString(c.name,val); } ed.apply(); }
              Career getOrCreateCareer(String name){ Career c=careerMap.get(name); if(c==null){ c=new Career(); c.name=name; careerMap.put(name,c);} return c; }
              void updateCareerAfterTournament(ArrayList<Integer> sortedIdx){ for(int rank=0; rank<sortedIdx.size(); rank++){ int pid=sortedIdx.get(rank); String name=players.get(pid).name; Career c=getOrCreateCareer(name); c.tourCount++; c.totalRank+=(rank+1); c.avgRank=(double)c.totalRank/c.tourCount; if((rank+1)<c.bestRank) c.bestRank=rank+1; Player p=players.get(pid); for(int i=0;i<p.opponents.size();i++){ int oid=p.opponents.get(i); if(oid==-1) continue; String oppName=players.get(oid).name; double res=p.results.get(i); int[] rec=c.h2h.getOrDefault(oppName,new int[]{0,0,0}); if(res==1) rec[0]++; else if(res==0) rec[1]++; else rec[2]++; c.h2h.put(oppName,rec); } } saveCareer(); }
              void showSettlementFixed(ArrayList<Integer> sortedIdx){
                  settlementLayout.removeAllViews();
                  LinearLayout box=new LinearLayout(this); box.setOrientation(LinearLayout.VERTICAL); box.setPadding(30,30,30,30); box.setBackgroundColor(Color.parseColor("#FFF3E0"));
                  TextView title=new TextView(this); title.setText("🏆 最终结果"); title.setTextSize(20); title.setGravity(Gravity.CENTER); title.setTextColor(Color.parseColor("#E65100")); box.addView(title);
                  if(sortedIdx.size()>=1){ TextView champ=new TextView(this); champ.setText("冠军: "+players.get(sortedIdx.get(0)).name); champ.setTextSize(18); champ.setGravity(Gravity.CENTER); box.addView(champ); }
                  StringBuilder report=new StringBuilder(); report.append("战报:\n");
                  for(int r=0;r<sortedIdx.size();r++){ int id=sortedIdx.get(r); Player p=players.get(id); String line=(r+1)+". "+p.name+" "+(int)p.score+"分 ["+p.wins+"-"+p.draws+"-"+p.losses+"]"; TextView tv=new TextView(this); tv.setText(line); tv.setPadding(10,6,10,6); if(r==0) tv.setTextColor(Color.parseColor("#FF6F00")); box.addView(tv); report.append(line).append("\n"); }
                  Button btnCopy=new Button(this); btnCopy.setText("复制战报"); btnCopy.setOnClickListener(v->{ android.content.ClipboardManager cm=(android.content.ClipboardManager)getSystemService(CLIPBOARD_SERVICE); cm.setPrimaryClip(android.content.ClipData.newPlainText("report", report.toString())); Toast.makeText(this,"已复制",0).show(); }); box.addView(btnCopy);
                  settlementLayout.addView(box);
              }
              void showCareerDialogNoChart(String name){ Career c=careerMap.get(name); if(c==null||c.tourCount==0){ Toast.makeText(this,name+" 暂无数据",0).show(); return; } ScrollView sv=new ScrollView(this); LinearLayout layout=new LinearLayout(this); layout.setOrientation(LinearLayout.VERTICAL); layout.setPadding(40,40,40,40); sv.addView(layout); TextView info=new TextView(this); info.setText("选手: "+name+"\n参赛: "+c.tourCount+"场\n最高: 第"+c.bestRank+"名\n平均: 第"+String.format("%.1f",c.avgRank)+"名\n\n对阵详情:"); info.setTextSize(16); layout.addView(info); if(c.h2h.isEmpty()){ TextView empty=new TextView(this); empty.setText("暂无对阵"); layout.addView(empty); } else { for(Map.Entry<String,int[]> e: c.h2h.entrySet()){ int w=e.getValue()[0], l=e.getValue()[1], d=e.getValue()[2]; int tot=w+l+d; double wr=tot>0?(double)w/tot*100:0; TextView tv=new TextView(this); tv.setText(e.getKey()+": "+w+"胜 "+l+"负 "+d+"平 胜率"+String.format("%.0f%%",wr)); tv.setPadding(0,8,0,8); layout.addView(tv); } } new AlertDialog.Builder(this).setView(sv).setPositiveButton("关闭",null).setNegativeButton("清除此人",(d,w)->{ careerMap.remove(name); saveCareer(); }).show(); }
              void savePlayers(){ StringBuilder sb=new StringBuilder(); for(int i=0;i<players.size();i++){ if(i>0) sb.append(";;"); sb.append(players.get(i).name.replace(";;"," ")); } prefs.edit().putString("player_names", sb.toString()).apply(); }
              void loadPlayers(){ String saved=prefs.getString("player_names",""); if(saved.isEmpty()) return; String[] arr=saved.split(";;"); for(String n:arr){ if(n.trim().isEmpty()) continue; Player p=new Player(); p.name=n.trim(); p.selected=true; players.add(p); } }
              void refreshPlayerList(){ playerListLayout.removeAllViews(); if(players.isEmpty()){ TextView tv=new TextView(this); tv.setText("暂无选手"); playerListLayout.addView(tv); return; } for(int i=0;i<players.size();i++){ final int idx=i; final String pName=players.get(i).name; LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL); row.setPadding(0,8,0,8); CheckBox cb=new CheckBox(this); cb.setChecked(players.get(i).selected); cb.setOnCheckedChangeListener((b,isChecked)->{ players.get(idx).selected=isChecked; }); TextView tv=new TextView(this); tv.setText((i+1)+". "+pName); tv.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); tv.setTextColor(Color.parseColor("#1565C0")); tv.setOnClickListener(v-> showCareerDialogNoChart(pName)); Button del=new Button(this); del.setText("X"); del.setOnClickListener(v->{ new AlertDialog.Builder(this).setTitle("二次确认").setMessage("删除 "+pName+"?").setPositiveButton("删除",(d,w)->{ players.remove(idx); savePlayers(); refreshPlayerList(); }).setNegativeButton("取消",null).show(); }); row.addView(cb); row.addView(tv); row.addView(del); playerListLayout.addView(row); } }
              void startTournament(){ ArrayList<Integer> sel=getSelectedIndices(); if(sel.size()<2){ Toast.makeText(this,"至少勾选2人",0).show(); return; } try{ if(!inputRounds.getText().toString().isEmpty()) totalRounds=Integer.parseInt(inputRounds.getText().toString()); }catch(Exception e){} allRounds.clear(); currentRound=0; inKnockout=false; settlementLayout.removeAllViews(); knockoutLayout.removeAllViews(); for(int id: sel){ Player p=players.get(id); p.score=0; p.opponents.clear(); p.results.clear(); p.hasBye=false; p.wins=0; p.draws=0; p.losses=0; } nextRound(); }
              void nextRound(){ ArrayList<Integer> sel=getSelectedIndices(); if(currentRound>=totalRounds){ calcTieBreak(sel); statusText.setText("✓ 瑞士轮结束 共"+totalRounds+"轮"); showStandings(sel); ArrayList<Integer> sorted=getSortedIdx(sel); updateCareerAfterTournament(sorted); showSettlementFixed(sorted); showKnockoutEntry(sel); return; } currentRound++; ArrayList<Match> matches=generatePairing(sel); allRounds.add(matches); showRound(matches); calcTieBreak(sel); showStandings(sel); }
              ArrayList<Match> generatePairing(ArrayList<Integer> sel){ ArrayList<Integer> idx=new ArrayList<>(sel); Collections.sort(idx,(a,b)-> Double.compare(players.get(b).score, players.get(a).score)); ArrayList<Match> matches=new ArrayList<>(); HashSet<Integer> used=new HashSet<>(); if(idx.size()%2==1){ for(int k=idx.size()-1;k>=0;k--){ int id=idx.get(k); if(!players.get(id).hasBye &&!used.contains(id)){ Match m=new Match(); m.p1=id; m.p2=-1; m.result=4; matches.add(m); players.get(id).score+=BYE_PTS; players.get(id).results.add(1.0); players.get(id).opponents.add(-1); players.get(id).hasBye=true; players.get(id).wins++; used.add(id); break; } } } for(int i=0;i<idx.size();i++){ int a=idx.get(i); if(used.contains(a)) continue; used.add(a); int opponent=-1; for(int j=i+1;j<idx.size();j++){ int b=idx.get(j); if(used.contains(b)) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(used.contains(b)||b==a) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(!used.contains(b) && b!=a){ opponent=b; break; } } } if(opponent!=-1){ used.add(opponent); Match m=new Match(); m.p1=a; m.p2=opponent; matches.add(m); } } return matches; }
              void showRound(ArrayList<Match> matches){ if(inKnockout) return; roundLayout.removeAllViews(); TextView tv=new TextView(this); tv.setText("第 "+currentRound+" 轮 / 共 "+totalRounds+"轮"); tv.setTextSize(18); roundLayout.addView(tv); for(Match m:matches){ LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL); row.setPadding(10,12,10,12); TextView matchText=new TextView(this); matchText.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); if(m.p2==-1){ matchText.setText(players.get(m.p1).name+" 轮空 +3"); row.addView(matchText); } else { matchText.setText(players.get(m.p1).name+" vs "+players.get(m.p2).name); row.addView(matchText); if(m.result==0){ Button b1=new Button(this); b1.setText("胜"); Button bD=new Button(this); bD.setText("平"); Button b2=new Button(this); b2.setText("胜"); b1.setOnClickListener(v->{ setResult(m,1); showRound(matches); calcTieBreak(getSelectedIndices()); showStandings(getSelectedIndices()); }); b2.setOnClickListener(v->{ setResult(m,2); showRound(matches); calcTieBreak(getSelectedIndices()); showStandings(getSelectedIndices()); }); bD.setOnClickListener(v->{ setResult(m,3); showRound(matches); calcTieBreak(getSelectedIndices()); showStandings(getSelectedIndices()); }); row.addView(b1); row.addView(bD); row.addView(b2); } else { TextView res=new TextView(this); res.setText(m.result==1? players.get(m.p1).name+" 胜+3": m.result==2? players.get(m.p2).name+" 胜+3":"平局+1"); res.setTextColor(Color.BLUE); row.addView(res); } } roundLayout.addView(row); } boolean allDone=true; for(Match mm:matches) if(mm.p2!=-1 && mm.result==0) allDone=false; if(allDone){ Button btnNext=new Button(this); btnNext.setText(currentRound==totalRounds?"结束瑞士轮":"下一轮"); btnNext.setBackgroundColor(Color.parseColor("#4CAF50")); btnNext.setTextColor(Color.WHITE); btnNext.setOnClickListener(v-> nextRound()); roundLayout.addView(btnNext); } }
              void setResult(Match m,int result){ if(m.result!=0) return; m.result=result; if(result==1){ players.get(m.p1).score+=WIN_PTS; players.get(m.p1).wins++; players.get(m.p2).losses++; players.get(m.p1).results.add(1.0); players.get(m.p2).results.add(0.0); } else if(result==2){ players.get(m.p2).score+=WIN_PTS; players.get(m.p2).wins++; players.get(m.p1).losses++; players.get(m.p1).results.add(0.0); players.get(m.p2).results.add(1.0); } else if(result==3){ players.get(m.p1).score+=DRAW_PTS; players.get(m.p2).score+=DRAW_PTS; players.get(m.p1).draws++; players.get(m.p2).draws++; players.get(m.p1).results.add(0.5); players.get(m.p2).results.add(0.5); } if(m.p2!=-1){ players.get(m.p1).opponents.add(m.p2); players.get(m.p2).opponents.add(m.p1); } }
              void calcTieBreak(ArrayList<Integer> sel){ for(int id: sel){ Player p=players.get(id); double buch=0; for(int oid: p.opponents){ if(oid==-1) continue; buch+=players.get(oid).score; } p.buchholz=buch; } }
              ArrayList<Integer> getSortedIdx(ArrayList<Integer> sel){ ArrayList<Integer> idx=new ArrayList<>(sel); Collections.sort(idx,(a,b)->{ Player pa=players.get(a), pb=players.get(b); int cmp=Double.compare(pb.score, pa.score); if(cmp!=0) return cmp; cmp=Integer.compare(pb.wins, pa.wins); if(cmp!=0) return cmp; return Double.compare(pb.buchholz, pa.buchholz); }); return idx; }
              void showStandings(ArrayList<Integer> sel){ standingLayout.removeAllViews(); TextView t=new TextView(this); t.setText("\n积分榜 (详细):"); t.setTextSize(16); standingLayout.addView(t); ArrayList<Integer> idx=getSortedIdx(sel); for(int rank=0;rank<idx.size();rank++){ int id=idx.get(rank); Player p=players.get(id); StringBuilder detail=new StringBuilder(); detail.append((rank+1)+". "+p.name+" - "+(int)p.score+"分 ["+p.wins+"-"+p.draws+"-"+p.losses+"]\n"); detail.append(" 对手分: "+(int)p.buchholz+" | 对局: "); for(int i=0;i<p.opponents.size();i++){ int oid=p.opponents.get(i); if(oid==-1) detail.append("轮空 "); else { double r=p.results.get(i); String rs=r==1? "胜": r==0? "负":"平"; detail.append(players.get(oid).name+rs+" "); } } TextView row=new TextView(this); row.setText(detail.toString()); row.setPadding(15,12,15,12); row.setBackgroundColor(rank<4? Color.parseColor("#FFF9C4") : (rank%2==0? Color.parseColor("#F5F5F5"): Color.WHITE)); row.setTextSize(13); standingLayout.addView(row); } }
              void showKnockoutEntry(ArrayList<Integer> sel){ if(sel.size()<4) return; Button btn=new Button(this); btn.setText("前4进淘汰赛(已勾选)"); knockoutLayout.addView(btn); btn.setOnClickListener(v-> startTop4Knockout(sel)); }
              void startTop4Knockout(ArrayList<Integer> sel){ inKnockout=true; roundLayout.removeAllViews(); ArrayList<Integer> idx=getSortedIdx(sel); semi1=new Match(); semi1.p1=idx.get(0); semi1.p2=idx.get(3); semi1.label="半决赛1"; semi2=new Match(); semi2.p1=idx.get(1); semi2.p2=idx.get(2); semi2.label="半决赛2"; finalMatch=null; showTop4Bracket(); }
              void showTop4Bracket(){ knockoutLayout.removeAllViews(); addMatchView(semi1,true,false); addMatchView(semi2,true,false); if(semi1.result!=0 && semi2.result!=0){ if(finalMatch==null){ int w1=semi1.result==1?semi1.p1:semi1.p2; int w2=semi2.result==1?semi2.p1:semi2.p2; finalMatch=new Match(); finalMatch.p1=w1; finalMatch.p2=w2; finalMatch.label="决赛"; } addMatchView(finalMatch,false,false); if(finalMatch.result!=0){ ArrayList<Integer> finalOrder=new ArrayList<>(); finalOrder.add(finalMatch.result==1?finalMatch.p1:finalMatch.p2); finalOrder.add(finalMatch.result==1?finalMatch.p2:finalMatch.p1); for(int id: getSortedIdx(getSelectedIndices())) if(!finalOrder.contains(id)) finalOrder.add(id); updateCareerAfterTournament(finalOrder); showSettlementFixed(finalOrder); } } }
              void startFullKnockout(){ ArrayList<Integer> sel=getSelectedIndices(); if(sel.size()<2){ Toast.makeText(this,"至少勾选2人",0).show(); return; } inKnockout=true; roundLayout.removeAllViews(); standingLayout.removeAllViews(); knockoutLayout.removeAllViews(); settlementLayout.removeAllViews(); koRounds.clear(); koCurrent=0; ArrayList<Integer> all=new ArrayList<>(sel); Collections.shuffle(all); ArrayList<Match> first=new ArrayList<>(); for(int i=0;i<all.size();i+=2){ Match m=new Match(); m.p1=all.get(i); if(i+1<all.size()) m.p2=all.get(i+1); else { m.p2=-1; m.result=1; } first.add(m); } koRounds.add(first); showFullKnockout(); }
              void showFullKnockout(){ knockoutLayout.removeAllViews(); ArrayList<Match> cur=koRounds.get(koCurrent); TextView rt=new TextView(this); rt.setText("第"+(koCurrent+1)+"轮"); rt.setTextSize(16); knockoutLayout.addView(rt); for(Match m:cur){ addMatchView(m,false,true); } boolean allDone=true; for(Match m:cur) if(m.p2!=-1 && m.result==0) allDone=false; if(allDone){ ArrayList<Integer> winners=new ArrayList<>(); for(Match m:cur){ if(m.p2==-1) winners.add(m.p1); else winners.add(m.result==1?m.p1:m.p2); } if(winners.size()==1){ ArrayList<Integer> finalOrder=new ArrayList<>(); finalOrder.add(winners.get(0)); for(int id: getSortedIdx(getSelectedIndices())) if(!finalOrder.contains(id)) finalOrder.add(id); updateCareerAfterTournament(finalOrder); showSettlementFixed(finalOrder); } else if(winners.size()>1){ Button next=new Button(this); next.setText("下一轮 ("+winners.size()+"人)"); next.setOnClickListener(v->{ ArrayList<Match> nextRound=new ArrayList<>(); for(int i=0;i<winners.size();i+=2){ Match mm=new Match(); mm.p1=winners.get(i); if(i+1<winners.size()) mm.p2=winners.get(i+1); else { mm.p2=-1; mm.result=1; } nextRound.add(mm); } koRounds.add(nextRound); koCurrent++; showFullKnockout(); }); knockoutLayout.addView(next); } } }
              void addMatchView(Match m, boolean isSemi, boolean isFull){ if(m==null) return; LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.VERTICAL); row.setPadding(0,12,0,12); TextView label=new TextView(this); String vs=m.p2==-1? players.get(m.p1).name+" 轮空": players.get(m.p1).name+" vs "+players.get(m.p2).name; label.setText(m.label+" : "+vs); row.addView(label); LinearLayout btnRow=new LinearLayout(this); btnRow.setOrientation(LinearLayout.HORIZONTAL); if(m.result==0 && m.p2!=-1){ Button b1=new Button(this); b1.setText(players.get(m.p1).name+" 胜"); Button b2=new Button(this); b2.setText(players.get(m.p2).name+" 胜"); b1.setOnClickListener(v->{ m.result=1; if(isFull) showFullKnockout(); else showTop4Bracket(); }); b2.setOnClickListener(v->{ m.result=2; if(isFull) showFullKnockout(); else showTop4Bracket(); }); btnRow.addView(b1); btnRow.addView(b2); } else if(m.result!=0){ TextView res=new TextView(this); res.setText(m.result==1?players.get(m.p1).name+" 晋级":players.get(m.p2).name+" 晋级"); res.setTextColor(Color.BLUE); btnRow.addView(res); } row.addView(btnRow); knockoutLayout.addView(row); }
          }
