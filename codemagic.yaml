workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Build Swiss App
        script: |
          rm -f admob/build.gradle.kts admob/build.gradle
          mkdir -p admob/src/main/java/com/google/firebase/quickstart/admob
          cat > admob/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' }
          android {
              namespace 'com.google.firebase.quickstart.admob'
              compileSdk 34
              defaultConfig {
                  applicationId "com.google.firebase.quickstart.admob"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "2.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF
          cat > admob/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Swiss Tournament">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > admob/src/main/java/com/google/firebase/quickstart/admob/MainActivity.java <<'JAVA_EOF'
          package com.google.firebase.quickstart.admob;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.*;
          import android.graphics.Color;
          import java.util.*;
          public class MainActivity extends Activity {
              static class Player { String name; double score=0; ArrayList<Integer> opponents=new ArrayList<>(); boolean hasBye=false; int wins=0; }
              static class Match { int p1, p2; int result=0; }
              ArrayList<Player> players=new ArrayList<>();
              ArrayList<ArrayList<Match>> allRounds=new ArrayList<>();
              int totalRounds=5, currentRound=0;
              LinearLayout root, playerListLayout, roundLayout, standingLayout;
              EditText inputName, inputRounds;
              TextView statusText;
              @Override protected void onCreate(Bundle b){
                  super.onCreate(b);
                  root=new LinearLayout(this); root.setOrientation(LinearLayout.VERTICAL); root.setPadding(30,30,30,30);
                  ScrollView scroll=new ScrollView(this); scroll.addView(root); setContentView(scroll);
                  TextView title=new TextView(this); title.setText("Swiss Tournament"); title.setTextSize(24); title.setGravity(Gravity.CENTER); root.addView(title);
                  LinearLayout addRow=new LinearLayout(this); addRow.setOrientation(LinearLayout.HORIZONTAL);
                  inputName=new EditText(this); inputName.setHint("玩家名字"); inputName.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
                  Button btnAdd=new Button(this); btnAdd.setText("添加"); addRow.addView(inputName); addRow.addView(btnAdd); root.addView(addRow);
                  playerListLayout=new LinearLayout(this); playerListLayout.setOrientation(LinearLayout.VERTICAL); root.addView(playerListLayout);
                  LinearLayout roundSetRow=new LinearLayout(this); roundSetRow.setOrientation(LinearLayout.HORIZONTAL); roundSetRow.setPadding(0,20,0,0);
                  inputRounds=new EditText(this); inputRounds.setHint("总轮数 默认5"); inputRounds.setInputType(android.text.InputType.TYPE_CLASS_NUMBER); inputRounds.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1));
                  Button btnStart=new Button(this); btnStart.setText("开始比赛"); roundSetRow.addView(inputRounds); roundSetRow.addView(btnStart); root.addView(roundSetRow);
                  statusText=new TextView(this); statusText.setPadding(0,20,0,10); root.addView(statusText);
                  roundLayout=new LinearLayout(this); roundLayout.setOrientation(LinearLayout.VERTICAL); root.addView(roundLayout);
                  standingLayout=new LinearLayout(this); standingLayout.setOrientation(LinearLayout.VERTICAL); root.addView(standingLayout);
                  btnAdd.setOnClickListener(v->{ String name=inputName.getText().toString().trim(); if(name.isEmpty()) return; Player p=new Player(); p.name=name; players.add(p); inputName.setText(""); refreshPlayerList(); });
                  btnStart.setOnClickListener(v-> startTournament());
                  refreshPlayerList();
              }
              void refreshPlayerList(){ playerListLayout.removeAllViews(); TextView tv=new TextView(this); StringBuilder sb=new StringBuilder(); for(int i=0;i<players.size();i++){ if(i>0) sb.append(", "); sb.append(players.get(i).name); } tv.setText("已添加 "+players.size()+" 人: "+sb); playerListLayout.addView(tv); }
              void startTournament(){ if(players.size()<2){ Toast.makeText(this,"至少2人",Toast.LENGTH_SHORT).show(); return; } try{ if(!inputRounds.getText().toString().isEmpty()) totalRounds=Integer.parseInt(inputRounds.getText().toString()); }catch(Exception e){} if(totalRounds<1) totalRounds=1; allRounds.clear(); currentRound=0; for(Player p:players){ p.score=0; p.opponents.clear(); p.hasBye=false; p.wins=0; } nextRound(); }
              void nextRound(){ if(currentRound>=totalRounds){ statusText.setText("比赛结束！共 "+totalRounds+" 轮"); showStandings(); return; } currentRound++; ArrayList<Match> matches=generatePairing(); allRounds.add(matches); showRound(matches); showStandings(); }
              ArrayList<Match> generatePairing(){ ArrayList<Integer> idx=new ArrayList<>(); for(int i=0;i<players.size();i++) idx.add(i); Collections.sort(idx,(a,b)-> Double.compare(players.get(b).score, players.get(a).score)); ArrayList<Match> matches=new ArrayList<>(); boolean[] used=new boolean[players.size()]; if(idx.size()%2==1){ for(int k=idx.size()-1;k>=0;k--){ int id=idx.get(k); if(!players.get(id).hasBye &&!used[id]){ Match m=new Match(); m.p1=id; m.p2=-1; m.result=4; matches.add(m); players.get(id).score+=1; players.get(id).hasBye=true; players.get(id).wins++; used[id]=true; break; } } } for(int i=0;i<idx.size();i++){ int a=idx.get(i); if(used[a]) continue; used[a]=true; int opponent=-1; for(int j=i+1;j<idx.size();j++){ int b=idx.get(j); if(used[b]) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(used[b]||b==a) continue; if(!players.get(a).opponents.contains(b)){ opponent=b; break; } } } if(opponent==-1){ for(int j=0;j<idx.size();j++){ int b=idx.get(j); if(!used[b] && b!=a){ opponent=b; break; } } } if(opponent!=-1){ used[opponent]=true; Match m=new Match(); m.p1=a; m.p2=opponent; matches.add(m); } } return matches; }
              void showRound(ArrayList<Match> matches){ roundLayout.removeAllViews(); TextView tv=new TextView(this); tv.setText("第 "+currentRound+" / "+totalRounds+" 轮"); tv.setTextSize(20); roundLayout.addView(tv); for(int i=0;i<matches.size();i++){ Match m=matches.get(i); LinearLayout row=new LinearLayout(this); row.setOrientation(LinearLayout.HORIZONTAL); row.setPadding(0,10,0,10); row.setBackgroundColor(i%2==0? Color.parseColor("#F0F0F0"): Color.WHITE); TextView matchText=new TextView(this); matchText.setLayoutParams(new LinearLayout.LayoutParams(0,-2,1)); matchText.setTextSize(16); if(m.p2==-1){ matchText.setText(players.get(m.p1).name+" 轮空 +1分"); row.addView(matchText); } else { matchText.setText(players.get(m.p1).name+" vs "+players.get(m.p2).name); row.addView(matchText); if(m.result==0){ Button b1=new Button(this); b1.setText(players.get(m.p1).name+"胜"); Button bDraw=new Button(this); bDraw.setText("平"); Button b2=new Button(this); b2.setText(players.get(m.p2).name+"胜"); b1.setOnClickListener(v->{ setResult(m,1); showRound(matches); showStandings(); }); bDraw.setOnClickListener(v->{ setResult(m,3); showRound(matches); showStandings(); }); b2.setOnClickListener(v->{ setResult(m,2); showRound(matches); showStandings(); }); row.addView(b1); row.addView(bDraw); row.addView(b2); } else { TextView res=new TextView(this); String r=m.result==1? players.get(m.p1).name+"胜": m.result==2? players.get(m.p2).name+"胜":"平局"; res.setText(" "+r); res.setTextColor(Color.BLUE); row.addView(res); } } roundLayout.addView(row); } boolean allDone=true; for(Match m:matches) if(m.p2!=-1 && m.result==0) allDone=false; if(allDone){ Button btnNext=new Button(this); btnNext.setText(currentRound==totalRounds?"查看最终排名":"开始下一轮"); btnNext.setOnClickListener(v-> nextRound()); roundLayout.addView(btnNext); statusText.setText("第"+currentRound+"轮已结束"); } else statusText.setText("第"+currentRound+"轮进行中，请录比分"); }
              void setResult(Match m,int result){ if(m.result!=0) return; m.result=result; if(result==1){ players.get(m.p1).score+=1; players.get(m.p1).wins++; } else if(result==2){ players.get(m.p2).score+=1; players.get(m.p2).wins++; } else if(result==3){ players.get(m.p1).score+=0.5; players.get(m.p2).score+=0.5; } players.get(m.p1).opponents.add(m.p2); players.get(m.p2).opponents.add(m.p1); }
              void showStandings(){ standingLayout.removeAllViews(); TextView t=new TextView(this); t.setText("\n积分榜:"); t.setTextSize(18); standingLayout.addView(t); ArrayList<Integer> idx=new ArrayList<>(); for(int i=0;i<players.size();i++) idx.add(i); Collections.sort(idx,(a,b)->{ int cmp=Double.compare(players.get(b).score, players.get(a).score); if(cmp!=0) return cmp; return Integer.compare(players.get(b).wins, players.get(a).wins); }); for(int rank=0;rank<idx.size();rank++){ int id=idx.get(rank); Player p=players.get(id); TextView row=new TextView(this); row.setText((rank+1)+". "+p.name+" - "+p.score+"分 ("+p.wins+"胜)"); row.setPadding(0,5,0,5); standingLayout.addView(row); } }
          }
          JAVA_EOF
          sed -i '' 's/9.6.1/8.7/' gradle/wrapper/gradle-wrapper.properties || sed -i 's/9.6.1/8.7/' gradle/wrapper/gradle-wrapper.properties
          rm -f build.gradle.kts build.gradle settings.gradle
          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "quickstart"
          include(":admob")
          EOF
          chmod +x gradlew
         ./gradlew :admob:assembleDebug
    artifacts:
      - "**/*.apk"
